[project]
name = "devsecops"
version = "0.1.0"
description = "Multi-Agent DevSecOps Pipeline (CMPSC 320, Fall 2026)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devsecops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["docker: needs a running Docker daemon (skipped when there is none)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["devsecops", "app"]
